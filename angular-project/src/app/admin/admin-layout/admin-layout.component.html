<div class="admin-layout">
  <!-- Admin Sidebar -->
  <nav class="admin-sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-shield-alt"></i>
        <span class="logo-text" *ngIf="!isSidebarCollapsed">Admin Panel</span>
      </div>
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <i class="fas" [class.fa-bars]="!isSidebarCollapsed" [class.fa-times]="isSidebarCollapsed"></i>
      </button>
    </div>

    <div class="sidebar-content">
      <!-- User Info -->
      <div class="user-info">
        <div class="user-avatar">
          <i class="fas fa-user-shield"></i>
        </div>
        <div class="user-details" *ngIf="!isSidebarCollapsed">
          <h6>{{ getDisplayName() }}</h6>
          <small>{{ currentUser?.email || 'admin@system.com' }}</small>
        </div>
      </div>

      <!-- Navigation Menu -->
      <ul class="nav-menu">
        <li class="nav-item">
          <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
            <i class="fas fa-tachometer-alt"></i>
            <span class="nav-text" *ngIf="!isSidebarCollapsed">Tableau de bord</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/users" routerLinkActive="active" class="nav-link">
            <i class="fas fa-users"></i>
            <span class="nav-text" *ngIf="!isSidebarCollapsed">Utilisateurs</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/settings" routerLinkActive="active" class="nav-link">
            <i class="fas fa-cog"></i>
            <span class="nav-text" *ngIf="!isSidebarCollapsed">Paramètres</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/logs" routerLinkActive="active" class="nav-link">
            <i class="fas fa-file-alt"></i>
            <span class="nav-text" *ngIf="!isSidebarCollapsed">Journaux</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/reports" routerLinkActive="active" class="nav-link">
            <i class="fas fa-chart-bar"></i>
            <span class="nav-text" *ngIf="!isSidebarCollapsed">Rapports</span>
          </a>
        </li>
      </ul>

      <!-- System Status -->
      <div class="system-status" *ngIf="!isSidebarCollapsed">
        <h6>État du système</h6>
        <div class="status-item">
          <span class="status-indicator bg-success"></span>
          <span>Système opérationnel</span>
        </div>
        <div class="status-item">
          <span class="status-indicator bg-info"></span>
          <span>Base de données OK</span>
        </div>
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span *ngIf="!isSidebarCollapsed">Déconnexion</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <div class="main-content" [class.expanded]="isSidebarCollapsed">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col">
            <button class="mobile-sidebar-toggle d-md-none" (click)="toggleSidebar()">
              <i class="fas fa-bars"></i>
            </button>
            <h4 class="page-title">{{ pageTitle }}</h4>
          </div>
          <div class="col-auto">
            <div class="admin-actions">
              <button class="btn btn-outline-primary btn-sm me-2">
                <i class="fas fa-bell"></i>
                <span class="badge bg-danger">3</span>
              </button>
              <div class="dropdown">
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                  <i class="fas fa-user"></i>
                </button>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Profil</a></li>
                  <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>Paramètres</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" href="#" (click)="logout()"><i class="fas fa-sign-out-alt me-2"></i>Déconnexion</a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
