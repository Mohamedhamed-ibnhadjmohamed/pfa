<div class="user-profile">
  <div class="page-header">
    <div class="container">
      <div class="row">
        <div class="col">
          <h1 class="h3">Mon Profil</h1>
          <p class="text-muted">Gérez vos informations personnelles</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile Content -->
  <div class="container">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="profile-card">
          <div class="card-header">
            <h4 class="mb-0">
              <i class="fas fa-user me-2"></i>
              {{ isEditing ? 'Modifier mon profil' : 'Informations du profil' }}
            </h4>
          </div>
          <div class="card-body">
            <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="firstName" class="form-label">Prénom</label>
                  <input type="text" class="form-control" id="firstName" formControlName="firstName" 
                         [readonly]="!isEditing">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="lastName" class="form-label">Nom</label>
                  <input type="text" class="form-control" id="lastName" formControlName="lastName" 
                         [readonly]="!isEditing">
                </div>
              </div>
              
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" formControlName="email" 
                         [readonly]="!isEditing">
                </div>
                <div class="col-md-6 mb-3">
                  <label for="phone" class="form-label">Téléphone</label>
                  <input type="tel" class="form-control" id="phone" formControlName="phone" 
                         [readonly]="!isEditing">
                </div>
              </div>
              
              <div class="row">
                <div class="col-md-12 mb-3">
                  <label for="bio" class="form-label">Biographie</label>
                  <textarea class="form-control" id="bio" rows="4" formControlName="bio" 
                            [readonly]="!isEditing"></textarea>
                </div>
              </div>
              
              <div class="form-actions" *ngIf="isEditing">
                <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid || isLoading">
                  <i class="fas fa-save me-2"></i>
                  {{ isLoading ? 'Enregistrement...' : 'Mettre à jour' }}
                </button>
                <button type="button" class="btn btn-secondary" (click)="cancelEdit()">
                  <i class="fas fa-times me-2"></i>Annuler
                </button>
              </div>
              
              <div class="text-center" *ngIf="!isEditing">
                <button class="btn btn-outline-primary" (click)="toggleEdit()">
                  <i class="fas fa-edit me-2"></i>Modifier le profil
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
